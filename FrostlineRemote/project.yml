# Alternative zum mitgelieferten FrostlineRemote.xcodeproj: `brew install xcodegen && xcodegen`
name: FrostlineRemote
options:
  bundleIdPrefix: app.frostline
  deploymentTarget:
    iOS: "17.0"
targets:
  FrostlineRemote:
    type: application
    platform: iOS
    sources:
      - App
      - path: FrostlineRemoteKit/Sources/FrostlineRemoteKit
        group: FrostlineRemoteKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.frostline.remote
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: 5.0
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
