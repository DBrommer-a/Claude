name: Tests

on:
  push:
  pull_request:

jobs:
  flight-core:
    name: Flugphysik, Protokoll, Spiellogik (C#)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Tests
        run: dotnet test tools/flightcore-tests

  remote-kit:
    name: iPhone-Protokoll (Swift)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: swift test --package-path FrostlineRemote/FrostlineRemoteKit
